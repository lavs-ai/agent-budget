name: agent-budget usage report

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
            node-version: 20
            package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Initialise demo budget
        run: node bin/agent-budget.js init --unknown --days 30

      - name: Print budget status
        run: node bin/agent-budget.js status